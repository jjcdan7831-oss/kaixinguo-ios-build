name: Test and build Kaixinguo fullscreen controls

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaixinguo-fullscreen-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      SOURCE_COMMIT: 3788c09358374cc3c53bd04d70c335153b36e50c
    steps:
      - name: Download the pinned official source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.7.0 https://github.com/kadaliao/kaixinguo-ios.git source
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          xcodebuild -version
          command -v xcodegen >/dev/null || brew install xcodegen
          mkdir -p output

      - name: Apply the isolated fullscreen patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          data = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest() == 'e5ae2cda628dafe706a74abc05e1cfa95143b2d8cdc92eec3c642a036fa5945b'
          Path('output/fullscreen.patch').write_bytes(data)
          PY
          git -C source apply --check ../output/fullscreen.patch
          git -C source apply ../output/fullscreen.patch

      - name: Generate the Xcode project
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Run the existing core tests
        working-directory: source/KaixinguoKit
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee ../../output/core-tests.log

      - name: Test fullscreen geometry on iPhone and iPad in both appearances
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > ../output/simulators.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('../output/simulators.json'))
          devices = [d for group in data['devices'].values() for d in group if d.get('isAvailable')]
          phones = [d for d in devices if 'iPhone' in d['name']]
          pads = [d for d in devices if 'iPad' in d['name']]
          assert phones and pads, 'An iPhone and an iPad simulator are required'
          phone = next((d for d in phones if 'Duo' in d['name']), phones[0])
          pad = pads[0]
          chosen = {'phone': phone, 'ipad': pad}
          json.dump(chosen, open('../output/test-devices.json', 'w'), indent=2)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"PHONE_SIM={phone['udid']}\nPAD_SIM={pad['udid']}\n")
          print(json.dumps(chosen, indent=2))
          PY
          PHONE_SIM=$(python3 -c "import json;print(json.load(open('../output/test-devices.json'))['phone']['udid'])")
          PAD_SIM=$(python3 -c "import json;print(json.load(open('../output/test-devices.json'))['ipad']['udid'])")
          for device in "$PHONE_SIM" "$PAD_SIM"; do
            xcrun simctl boot "$device" || true
            xcrun simctl bootstatus "$device" -b
            for appearance in light dark; do
              xcrun simctl ui "$device" appearance "$appearance"
              result="../output/ui-${device}-${appearance}.xcresult"
              xcodebuild test -project Kaixinguo.xcodeproj -scheme Kaixinguo \
                -destination "platform=iOS Simulator,id=$device" \
                -derivedDataPath "$RUNNER_TEMP/kaixinguo-simulator" \
                -parallel-testing-enabled NO \
                -only-testing:KaixinguoUITests/FullscreenTests \
                -resultBundlePath "$result" \
                CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= \
                2>&1 | tee "../output/ui-${device}-${appearance}.log"
              xcrun xcresulttool export attachments --path "$result" \
                --output-path "../output/screenshots-${device}-${appearance}"
            done
            xcrun simctl shutdown "$device"
          done

      - name: Run the existing online playback test
        working-directory: source/KaixinguoKit
        shell: bash
        run: |
          set -euo pipefail
          KX_ONLINE=1 swift test --filter playsOnline 2>&1 | tee ../../output/online-playback.log

      - name: Run the existing iPhone interface smoke tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test -project Kaixinguo.xcodeproj -scheme Kaixinguo \
            -destination "platform=iOS Simulator,id=$PHONE_SIM" \
            -derivedDataPath "$RUNNER_TEMP/kaixinguo-simulator" \
            -parallel-testing-enabled NO \
            -only-testing:KaixinguoUITests/SmokeTests \
            -resultBundlePath ../output/playback-smoke.xcresult \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= \
            2>&1 | tee ../output/playback-smoke.log
          xcrun xcresulttool export attachments --path ../output/playback-smoke.xcresult \
            --output-path ../output/playback-smoke-screenshots

      - name: Build the iPhone and iPad app without signing
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Kaixinguo.xcodeproj \
            -scheme Kaixinguo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/kaixinguo-device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            2>&1 | tee ../output/device-build.log

      - name: Package and inspect the unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$RUNNER_TEMP/kaixinguo-device/Build/Products/Release-iphoneos/Kaixinguo.app" \
            "$RUNNER_TEMP/package/Payload/Kaixinguo.app"
          cd "$RUNNER_TEMP/package"
          ditto -c -k --sequesterRsrc --keepParent Payload \
            "$GITHUB_WORKSPACE/output/Kaixinguo-0.7.0-fullscreen-build13-unsigned.ipa"
          cd "$GITHUB_WORKSPACE/output"
          shasum -a 256 Kaixinguo-0.7.0-fullscreen-build13-unsigned.ipa > SHA256SUMS
          python3 - <<'PY'
          import json, plistlib, zipfile
          with zipfile.ZipFile('Kaixinguo-0.7.0-fullscreen-build13-unsigned.ipa') as z:
              assert z.testzip() is None
              p = plistlib.loads(z.read('Payload/Kaixinguo.app/Info.plist'))
              assert p['CFBundleIdentifier'] == 'com.kadaliao.kaixinguo'
              assert p['CFBundleShortVersionString'] == '0.7.0'
              assert p.get('UIDeviceFamily') == [1, 2]
              assert not p.get('UIRequiresFullScreen', False)
              assert p.get('DTSDKName') == 'iphoneos27.1'
              assert p['CFBundleVersion'] == '13'
              assert not any('/Watch/' in n for n in z.namelist())
              keys = ['CFBundleIdentifier', 'CFBundleShortVersionString',
                      'CFBundleVersion', 'MinimumOSVersion', 'DTSDKName',
                      'UIDeviceFamily', 'UIRequiresFullScreen']
              metadata = {k: p.get(k) for k in keys}
              metadata['source_commit'] = '3788c09358374cc3c53bd04d70c335153b36e50c'
              metadata['signed'] = False
              metadata['local_patch_sha256'] = 'e5ae2cda628dafe706a74abc05e1cfa95143b2d8cdc92eec3c642a036fa5945b'
              metadata['local_variant'] = 'fullscreen-controls-build13'
              with open('build-metadata.json', 'w') as f:
                  json.dump(metadata, f, indent=2)
              print(json.dumps(metadata, indent=2))
          PY

      - name: Save the package and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Kaixinguo-0.7.0-fullscreen-build13-unsigned
          path: output/
          retention-days: 1
          if-no-files-found: error
